<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        p {
            font-size: 1.125rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .contact-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #f8fafc;
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .contact-btn:hover {
            background-color: #e2e8f0;
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Coming Soon</span>
        <h1>We're Building Something Great</h1>
        <p>Our website is currently under construction. We are working hard to deliver the best experience possible. Stay tuned!</p>
        
        <a href="mailto:info@example.com" class="contact-btn">Get in Touch</a>

        <footer>
            &copy; <script>document.write(new Date().getFullYear())</script> All rights reserved.
        </footer>
    </div>

</body>
</html>
